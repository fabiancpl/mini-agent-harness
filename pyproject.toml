[project]
name = "mini-agent-harness"
version = "0.2.0"
description = "A small, readable ReAct agent harness with sandboxed file-system tools"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
mini-agent = "mini_agent.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
# `testpaths` is also what keeps evals/ out of the suite: `pytest` collects tests/ only,
# so nobody running the tests is ever billed by a real provider. See TESTING.md.
testpaths = ["tests"]
addopts = "-q"
# examples/ holds the EXTENDING.md walkthrough tool, and evals/ holds the eval *checkers*,
# which are unit-tested even though the evals themselves never run here. Declaring the paths
# beats a sys.path insert inside a test module.
pythonpath = ["examples", "evals"]

[tool.ruff]
# Ruff enforces the conventions CLAUDE.md already documents; it adds no runtime dependency
# and nothing here is a new rule, only a written-down one made checkable.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately narrow: pycodestyle errors, pyflakes, and import order. Anything broader
# starts arguing with the house style instead of enforcing it. Pyflakes alone earns its
# keep -- it found a duplicated test name that had been silently shadowing another test.
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["mini_agent"]
# tests/ and examples/ are on the path via `pythonpath`, not installed, so tell isort that
# rather than letting it shuffle them in with third-party imports.
known-local-folder = ["conftest", "word_count_tool", "run_eval"]

[tool.ruff.format]
quote-style = "double"
