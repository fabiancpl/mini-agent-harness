# Copy this file to config.yaml and edit it:
#
#     cp config.example.yaml config.yaml
#
# config.yaml is gitignored. No secret ever belongs in either file — see api_key_env below.

llm:
  # Any OpenAI-compatible server works: OpenAI, Ollama, vLLM, LM Studio, a gateway…
  # Include the version segment, but no trailing slash: the client posts to
  # {base_url}/chat/completions
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"

  # The NAME of the environment variable holding the key — not the key itself.
  # Set it before running:  export OPENAI_API_KEY=sk-...
  # For a local server that needs no auth, any placeholder value will do.
  api_key_env: "OPENAI_API_KEY"

  temperature: 0.0        # 0 keeps tool-calling behaviour deterministic and easy to debug
  max_tokens: 2048
  timeout_seconds: 60

agent:
  # The sandbox root. Every path the agent supplies is resolved under this folder, and
  # anything that lands outside it is refused. Relative paths here are interpreted
  # relative to THIS config file, so the config works from any working directory.
  root_path: "./workspace"

  # Hard upper bound on ReAct iterations. Stops a confused model from looping forever.
  max_steps: 12

  # Optional path to a text file replacing the built-in system prompt. null = built-in.
  system_prompt_file: null

tools:
  # With `enabled` left commented out, every registered tool is available. That is the
  # default on purpose: a tool you add in tools/build_registry then works immediately,
  # with no second place to remember to edit.
  #
  # Uncomment it to restrict the agent. The list is a strict allow-list, and both halves
  # of that matter:
  #
  #   * a name that is not registered is an error, so a typo is caught at startup;
  #   * a tool that IS registered but is NOT listed here is simply not loaded -- silently,
  #     because an allow-list you wrote deliberately should not nag you about the tools you
  #     left out. So if you add a tool and cannot see it, check this list first. The startup
  #     banner prints "N of M registered" whenever a list is active, to make that visible.
  #
  # The order given is the order the tools are advertised to the model. Listing only the
  # first four gives you a read-only agent that can explore and explain but never touch
  # anything.
  #
  # Note what is missing and cannot be added: there is no delete, remove, unlink, or shell
  # tool anywhere in the registry. The agent cannot destroy your files because that ability
  # was never built, not because a prompt asked it nicely.
  #
  # move and copy are here despite sounding destructive: both refuse to overwrite an
  # existing destination, so content is always preserved and every relocation can be
  # undone. That is the line this project draws -- no operation may make existing content
  # unreachable.
  #
  # enabled:
  #   - list_directory
  #   - find_files
  #   - search_text
  #   - read_file
  #   - create_directory
  #   - write_file
  #   - append_to_file
  #   - edit_file
  #   - move
  #   - copy
